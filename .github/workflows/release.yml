name: Release
# Push a tag like v0.9.0 (matching the VERSION file) to build the DMG and publish a GitHub Release.
# Nokcandu's built-in updater picks up the newest non-draft release and its .dmg asset.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check tag matches VERSION
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match VERSION $V"; exit 1; }
      - name: Signing identity (keeps macOS permissions across updates)
        env:
          P12: ${{ secrets.NOKCANDU_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.NOKCANDU_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing secret: ad-hoc build"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/id.p12"
      - name: Build, test and package
        run: ./make-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          NOTES="release-notes/v$V.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "${GITHUB_REF_NAME}" "build/Nokcandu-$V.dmg" "build/Nokcandu-$V.dmg.sha256" \
            --title "Nokcandu $V" --notes-file "$NOTES" --verify-tag
