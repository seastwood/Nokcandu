name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Check shared profile fix IDs and schemas
        run: |
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/seastwood/Nokcandu-Profiles/main/scripts/profiles.py -o "$RUNNER_TEMP/profile-validator.py"
          python3 Tools/profile-check/check-fix-ids.py "$RUNNER_TEMP/profile-validator.py"
      - name: Test
        run: swift test
      - name: Build app
        run: ./build-app.sh
      - name: Ensure x86 Windows execution on Apple Silicon
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Real Wine 10 and 11 regressions (32 and 64 bit)
        timeout-minutes: 60
        run: python3 Tools/socket-events/ci.py
      - name: Check shell scripts
        run: bash -n build-app.sh make-dmg.sh dev-watch-agent.sh Resources/borderless/build.sh Resources/cabextract/build.sh Engine/wpcap/build.sh Engine/wpcap/package-source.sh Tools/native-ipx/packet-access.sh Tools/ipx-probe/win98/build.sh Tools/audio-guard/build-permission-probe.sh
