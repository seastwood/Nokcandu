name: Profiles mirror
# Game profiles moved to github.com/seastwood/Nokcandu-Profiles. Nokcandu 0.9.1–0.9.2 read the catalog from this
# repo's Pages site, so this keeps a copy of the new catalog here and redirects the old website.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profiles.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: profiles-mirror
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Copy the catalog and redirect the website
        run: |
          mkdir -p public
          curl -fsSL https://seastwood.github.io/Nokcandu-Profiles/catalog.json -o public/catalog.json || echo '{"generated":"","profiles":[]}' > public/catalog.json
          cat > public/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Nokcandu Game Profiles</title>
          <meta http-equiv="refresh" content="0; url=https://seastwood.github.io/Nokcandu-Profiles/">
          <p>Game profiles moved to <a href="https://seastwood.github.io/Nokcandu-Profiles/">seastwood.github.io/Nokcandu-Profiles</a>.</p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
