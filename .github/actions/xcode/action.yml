name: Verified Xcode
description: Select the release-tested Xcode 27.2 toolchain
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
        bash scripts/check-xcode-toolchain.sh
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
